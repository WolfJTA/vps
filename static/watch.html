<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Watch</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0c0d0f;
    color: #e8e8ea;
    padding: 20px;
  }
  .wrap { width: 100%; max-width: 900px; }
  video {
    width: 100%;
    max-height: 80vh;
    border-radius: 10px;
    background: #000;
    display: block;
  }
  h1 {
    font-size: 15px;
    font-weight: 500;
    margin: 14px 2px 4px;
    word-break: break-word;
  }
  .meta { font-size: 12px; color: #8a8a90; margin: 0 2px; }
  .state { text-align: center; color: #8a8a90; font-size: 14px; padding: 60px 0; }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="state" id="state">Loading…</div>
  </div>

<script>
async function load() {
  const slug = window.location.pathname.split('/').filter(Boolean).pop();
  const wrap = document.getElementById('wrap');

  let res;
  try {
    res = await fetch('/api/videos/by-slug/' + encodeURIComponent(slug));
  } catch {
    wrap.innerHTML = '<div class="state">Couldn\'t reach the server.</div>';
    return;
  }

  if (!res.ok) {
    wrap.innerHTML = '<div class="state">This link doesn\'t point to a video.</div>';
    return;
  }

  const v = await res.json();
  document.title = v.original_name;

  wrap.innerHTML = `
    <video controls autoplay playsinline src="/files/${encodeURIComponent(v.stored_name)}"></video>
    <h1>${escapeHtml(v.original_name)}</h1>
    <div class="meta">${formatBytes(v.size_bytes)} · uploaded ${v.uploaded_at}</div>
  `;
}

function formatBytes(n) {
  const units = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return n.toFixed(1) + ' ' + units[i];
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

load();
</script>
</body>
</html>
